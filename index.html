<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="dashboard-container">
    <!-- Header / Greeting Section -->
    <header class="card greeting-card">
      <h1 id="clock">00:00:00</h1>
      <p id="date">Monday, January 1, 2026</p>
      <h2 id="greeting">Good Morning</h2>
    </header>

    <!-- Main Grid Content -->
    <main class="grid-layout">
      <!-- Focus Timer -->
      <section class="card timer-card">
        <h3>Focus Timer</h3>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="stop-btn" class="btn btn-secondary">Stop</button>
          <button id="reset-btn" class="btn btn-light">Reset</button>
        </div>
      </section>

      <!-- To-Do List -->
      <section class="card todo-card">
        <h3>Tasks</h3>
        <form id="todo-form" class="input-group">
          <input type="text" id="todo-input" placeholder="Add a new task..." required>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <ul id="todo-list" class="todo-list">
          <!-- Item tugas akan muncul di sini via JavaScript -->
        </ul>
      </section>

      <!-- Quick Links -->
      <section class="card links-card">
        <h3>Quick Links</h3>
        <form id="link-form" class="input-group">
          <input type="text" id="link-name-input" placeholder="Link name" required>
          <input type="url" id="link-url-input" placeholder="URL (e.g. https://google.com)" required>
          <button type="submit" class="btn btn-primary">Add Link</button>
        </form>
        <div id="links-container" class="links-container">
          <!-- Tombol link akan muncul di sini via JavaScript -->
        </div>
      </section>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
